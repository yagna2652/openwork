name: Sync Upstream OpenWork

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Upstream branch to merge from different-ai/openwork
        required: false
        default: dev
      base_branch:
        description: Fork branch that carries Pulp document-runtime changes
        required: false
        default: pulp/document-runtime

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream-openwork-${{ github.event.inputs.base_branch || 'pulp/document-runtime' }}
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          upstream_branch="${{ github.event.inputs.upstream_branch || 'dev' }}"
          base_branch="${{ github.event.inputs.base_branch || 'pulp/document-runtime' }}"
          sync_branch="chore/sync-upstream-openwork"
          echo "upstream_branch=$upstream_branch" >> "$GITHUB_OUTPUT"
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"
          echo "sync_branch=$sync_branch" >> "$GITHUB_OUTPUT"

      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.inputs.outputs.base_branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Fetch upstream
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/different-ai/openwork.git
          git fetch origin "${{ steps.inputs.outputs.base_branch }}"
          git fetch upstream "${{ steps.inputs.outputs.upstream_branch }}"
          upstream_ref="upstream/${{ steps.inputs.outputs.upstream_branch }}"
          upstream_count="$(git rev-list --count "HEAD..$upstream_ref")"
          echo "upstream_count=$upstream_count" >> "$GITHUB_OUTPUT"
          if [ "$upstream_count" = "0" ]; then
            echo "No upstream commits to sync."
          fi

      - name: Merge upstream into sync branch
        if: steps.fetch.outputs.upstream_count != '0'
        id: merge
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ steps.inputs.outputs.sync_branch }}" "origin/${{ steps.inputs.outputs.base_branch }}"
          if git merge --no-edit "upstream/${{ steps.inputs.outputs.upstream_branch }}"; then
            echo "merge_conflict=false" >> "$GITHUB_OUTPUT"
          else
            conflict_files="$(git diff --name-only --diff-filter=U)"
            {
              echo "merge_conflict=true"
              echo "conflict_files<<EOF"
              printf '%s\n' "$conflict_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi
          echo "merge_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report upstream sync conflict
        if: steps.fetch.outputs.upstream_count != '0' && steps.merge.outputs.merge_conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ steps.inputs.outputs.base_branch }}
          UPSTREAM_BRANCH: ${{ steps.inputs.outputs.upstream_branch }}
          UPSTREAM_COUNT: ${{ steps.fetch.outputs.upstream_count }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        shell: bash
        run: |
          set -euo pipefail
          issue_body="$RUNNER_TEMP/sync-conflict-body.md"
          {
            echo "Automated sync from \`different-ai/openwork:$UPSTREAM_BRANCH\` into \`$BASE_BRANCH\` hit merge conflicts."
            echo ""
            echo "Upstream commits waiting: \`$UPSTREAM_COUNT\`"
            echo ""
            echo "Conflict files:"
            echo ""
            printf '%s\n' "$CONFLICT_FILES" | sed 's/^/- `/' | sed 's/$/`/'
            echo ""
            echo "Resolution workflow:"
            echo ""
            echo "1. Ask Codex to resolve the upstream sync conflict on \`$BASE_BRANCH\`."
            echo "2. Pay special attention to document runtime files: route handling, selected-text task creation, right-side document rail, and workspace file APIs."
            echo "3. Run focused document checks before pushing the sync branch."
          } > "$issue_body"

          existing_issue="$(gh issue list --state open --search "Upstream OpenWork sync conflict in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_issue" ]; then
            gh issue edit "$existing_issue" --body-file "$issue_body"
            gh issue view "$existing_issue" --json url --jq .url
          else
            gh issue create \
              --title "Upstream OpenWork sync conflict" \
              --body-file "$issue_body"
          fi

          exit 1

      - name: Analyze document runtime impact
        if: steps.fetch.outputs.upstream_count != '0' && steps.merge.outputs.merge_conflict != 'true'
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          base_ref="origin/${{ steps.inputs.outputs.base_branch }}"
          changed_files="$(git diff --name-only "$base_ref"..HEAD)"
          watched_regex='^(\.github/workflows/|apps/app/src/react-app/domains/document/|apps/app/scripts/document/|apps/app/src/react-app/domains/session/|apps/app/src/react-app/shell/|apps/app/src/app/lib/openwork-server|apps/app/src/app/lib/opencode|apps/app/package\.json|package\.json|pnpm-lock\.yaml)'
          impacted_files="$(printf '%s\n' "$changed_files" | grep -E "$watched_regex" || true)"

          {
            echo "changed_files<<EOF"
            printf '%s\n' "$changed_files"
            echo "EOF"
            echo "impacted_files<<EOF"
            printf '%s\n' "$impacted_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$impacted_files" ]; then
            echo "document_runtime_impacted=true" >> "$GITHUB_OUTPUT"
          else
            echo "document_runtime_impacted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.fetch.outputs.upstream_count != '0' && steps.merge.outputs.merge_conflict != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run focused document checks
        if: steps.fetch.outputs.upstream_count != '0' && steps.merge.outputs.merge_conflict != 'true'
        run: bun test apps/app/scripts/document/document-task-prompt.test.ts

      - name: Run whitespace check
        if: steps.fetch.outputs.upstream_count != '0' && steps.merge.outputs.merge_conflict != 'true'
        run: git diff --check "origin/${{ steps.inputs.outputs.base_branch }}"..HEAD

      - name: Push sync branch
        if: steps.fetch.outputs.upstream_count != '0' && steps.merge.outputs.merge_conflict != 'true'
        run: git push --force-with-lease origin "${{ steps.inputs.outputs.sync_branch }}"

      - name: Create or update sync PR
        if: steps.fetch.outputs.upstream_count != '0' && steps.merge.outputs.merge_conflict != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ steps.inputs.outputs.base_branch }}
          SYNC_BRANCH: ${{ steps.inputs.outputs.sync_branch }}
          UPSTREAM_BRANCH: ${{ steps.inputs.outputs.upstream_branch }}
          UPSTREAM_COUNT: ${{ steps.fetch.outputs.upstream_count }}
          DOC_IMPACTED: ${{ steps.impact.outputs.document_runtime_impacted }}
          IMPACTED_FILES: ${{ steps.impact.outputs.impacted_files }}
        shell: bash
        run: |
          set -euo pipefail
          pr_body="$RUNNER_TEMP/sync-pr-body.md"
          {
            echo "Automated sync from \`different-ai/openwork:$UPSTREAM_BRANCH\` into \`$BASE_BRANCH\`."
            echo ""
            echo "Upstream commits included: \`$UPSTREAM_COUNT\`"
            echo ""
            echo "Document runtime impacted: \`$DOC_IMPACTED\`"
            echo ""
            if [ -n "$IMPACTED_FILES" ]; then
              echo "Watched files changed:"
              echo ""
              printf '%s\n' "$IMPACTED_FILES" | sed 's/^/- `/' | sed 's/$/`/'
              echo ""
            fi
            echo "Checks run:"
            echo ""
            echo "- \`bun test apps/app/scripts/document/document-task-prompt.test.ts\`"
            echo "- \`git diff --check origin/$BASE_BRANCH..HEAD\`"
            echo ""
            echo "Review guidance:"
            echo ""
            echo "- If document runtime is impacted, inspect the document route, right rail, file APIs, and selected-text task flow before merging."
            echo "- If document runtime is not impacted and checks are green, this should usually be a low-risk substrate sync."
          } > "$pr_body"

          existing_pr="$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "Sync upstream OpenWork into Pulp document runtime" --body-file "$pr_body"
            gh pr view "$existing_pr" --json url --jq .url
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "Sync upstream OpenWork into Pulp document runtime" \
              --body-file "$pr_body"
          fi
